# El proyecto de Xcode sale de acá: `xcodegen generate` (el .xcodeproj no se versiona).
name: OtraMas
options:
  bundleIdPrefix: ar.com.otramas
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: M6935MSNQB
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  OtraMas:
    type: application
    platform: iOS
    sources:
      - path: OtraMas
        excludes: [Recursos/PrivacyInfo.xcprivacy]
      # El manifiesto de privacidad (lo pide App Store Connect): como recurso, explícito.
      - path: OtraMas/Recursos/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.otramas.app
        PRODUCT_NAME: OtraMas
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          # TestFlight por GitHub Actions con firma manual.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ar.com.otramas.app App Store
    info:
      path: OtraMas/Info.plist
      properties:
        CFBundleDisplayName: Otra Más
        CFBundleDevelopmentRegion: es-AR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Archivo.ttf
          - Figtree.ttf
        UILaunchScreen:
          UIColorName: Fondo
          UIImageName: Lanzamiento
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Todas las pantallas arrancan con la banda berenjena: barra de estado clara.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [whatsapp]
  OtraMasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OtraMasTests]
    dependencies:
      - target: OtraMas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OtraMas:
    build:
      targets:
        OtraMas: all
        OtraMasTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [OtraMasTests]
